[package]
name = "jw-clangd-index"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
log = "0.4.35"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }

[dev-dependencies]
tempfile = "3.27.0"
