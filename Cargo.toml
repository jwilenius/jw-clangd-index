[package]
name = "jw-clangd-index"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive"] }
env_logger = "0.11.12"
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
log = "0.4.35"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"

[dev-dependencies]
tempfile = "3.27.0"
